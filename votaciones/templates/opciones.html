<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opciones - {{ categoria.nombre }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f5f5f5; }
.header { background: #1a237e; color: white; padding: 15px; text-align: center; }
.opcion-card { background: white; border: 2px solid #e0e0e0; border-radius: 15px; padding: 20px; margin-bottom: 15px; display: flex; align-items: center; cursor: pointer; }
.btn-dorado { background: #fbc02d; color: #1a237e; font-weight: bold; width: 100%; padding: 12px; border: none; border-radius: 25px; }
</style>
</head>
<body>
<div class="header">
  <h4>Opciones: {{ categoria.nombre }}</h4>
</div>

<div class="container py-4">
  <h5 class="mb-3">Selecciona un participante</h5>

  <!-- FORMULARIO POST HACIA LA VISTA registrar_voto -->
  <form method="post" action="{% url 'registrar_voto' %}">
    {% csrf_token %}
    
    {% for opcion in opciones %}
    <label class="opcion-card w-100">
      <input type="radio" name="opcion_id" value="{{ opcion.id }}" required class="me-3" style="transform: scale(1.5);">
      <div>
        <h5 class="mb-0">{{ opcion.nombre }}</h5>
        <small class="text-muted">Votación: {{ opcion.votacion.nombre }}</small>
      </div>
    </label>
    {% empty %}
    <div class="alert alert-warning">No hay opciones registradas.</div>
    {% endfor %}

    <button type="submit" class="btn btn-dorado mt-3">Continuar</button>
  </form>
  
  <div class="text-center mt-3">
    <a href="{% url 'lista_categorias' %}" class="text-muted">← Volver a categorías</a>
  </div>
</div>
</body>
</html>
