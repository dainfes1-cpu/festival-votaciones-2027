{% extends 'base.html' %}
{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-lock-fill fs-1 text-primary"></i>
                    <h3 class="fw-bold mt-2">Bienvenido</h3>
                    <p class="text-muted small">Ingresa tus credenciales para votar</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold small">Usuario</label>
                        <input type="text" name="username" class="form-control form-control-lg bg-light" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small">Contraseña</label>
                        <input type="password" name="password" class="form-control form-control-lg bg-light" required>
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger p-2 small rounded-3">Usuario o contraseña incorrectos.</div>
                    {% endif %}
                    <button type="submit" class="btn btn-dorado w-100 btn-lg">Ingresar</button>
                </form>
                <p class="text-center mt-4 mb-0 small">
                    ¿No tienes cuenta? <a href="{% url 'registro' %}" class="fw-bold text-decoration-none">Regístrate aquí</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
