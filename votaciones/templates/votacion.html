{% extends 'base.html' %}
{% block title %}{{ votacion.nombre }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-8">
            <div class="card card-custom p-4 p-md-5">
                <h2 class="fw-bold mb-4 text-primary">{{ votacion.nombre }}</h2>
                
                <div class="row mb-4">
                    <div class="col-6">
                        <small class="text-muted d-block">Apertura</small>
                        <strong>{{ votacion.fecha_inicio|date:"d M Y, H:i" }}</strong>
                    </div>
                    <div class="col-6">
                        <small class="text-muted d-block">Cierre</small>
                        <strong>{{ votacion.fecha_fin|date:"d M Y, H:i" }}</strong>
                    </div>
                </div>

                <div class="alert alert-warning border-0">
                    <i class="bi bi-info-circle-fill"></i> <strong>Regla:</strong> 1 voto por usuario.
                </div>

                <a href="{% url 'opciones' votacion.id %}" class="btn btn-dorado btn-lg w-100 mt-2">Ver opciones y votar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
